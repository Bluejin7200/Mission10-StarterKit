```
- 심각: 보안·런타임 오류·번들 오염 / 권장: 프로젝트 패턴 위반 / 참고: 개선 제안
- 각 항목은 확인한 코드 근거가 있을 때만 보고 (추측성 지적 금지)
- 수정이 필요한 항목은 수정 전/후 코드 예시 제시
- 문제가 없으면 "규칙 위반 없음"과 함께 확인한 항목 목록만 짧게 보고
- 마지막 줄: 심각 0건이면 "`/git:commit`으로 커밋하세요", 아니면 "수정 후 `/check` → 재리뷰""""
